App\Entity\Location:
    properties:
        latitude:
            - Range:
                min: -90
                max: 90
                # notInRangeMessage: 'Latitude must be between -90 and 90.'

        longitude:
            - Range:
                min: -180
                max: 180
                # notInRangeMessage: 'Longitude must be between -180 and 180.'

App\Entity\Measurement:
    properties:
        celsius:
          - Range:
              max: 40
              # notInRangeMessage: 'temperature must be lower or equal 40